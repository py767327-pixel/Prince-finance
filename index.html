<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b72">

<title>Prince Finance</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f6f9;
 color:#172033;
 font-size:14px
}

header{
 background:#173b72;
 color:white;
 padding:11px 13px;
 position:sticky;
 top:0;
 z-index:5
}

main{
 max-width:900px;
 margin:auto;
 padding:12px 12px 75px
}

.page{display:none}
.page.active{display:block}

.card{
 background:white;
 padding:13px;
 border-radius:11px;
 margin:9px 0;
 box-shadow:0 2px 7px #0001
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px
}

.stat{
 font-size:18px;
 font-weight:bold;
 margin-top:3px
}

.small,.muted{
 font-size:11px;
 color:#667
}

label{
 display:block;
 font-size:12px;
 font-weight:bold;
 margin-top:9px
}

input,textarea{
 width:100%;
 padding:10px;
 margin-top:4px;
 border:1px solid #d7dbe2;
 border-radius:8px;
 background:white;
 font-size:14px
}

textarea{
 min-height:65px
}

button{
 border:0;
 border-radius:8px;
 background:#173b72;
 color:white;
 font-weight:bold;
 padding:8px 10px;
 margin-top:6px;
 font-size:12px
}

button.secondary{
 background:#e8edf5;
 color:#173b72
}

button.danger{
 background:#c62828
}

button.success{
 background:#287a3e
}

button.full{
 width:100%
}

nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:white;
 display:flex;
 border-top:1px solid #ddd;
 z-index:10
}

nav button{
 flex:1;
 background:white;
 color:#173b72;
 border-radius:0;
 margin:0;
 padding:6px 2px;
 font-size:10px
}

/* CUSTOMER LIST */

.table{
 width:100%;
 border-collapse:collapse
}

.table th,
.table td{
 padding:9px 6px;
 border-bottom:1px solid #eee;
 text-align:left;
 font-size:12px
}

.table th{
 background:#eef2f8
}

.customer-row{
 cursor:pointer
}

.customer-row:active{
 background:#eef2f8
}

/* STATUS */

.badge{
 display:inline-block;
 padding:4px 7px;
 border-radius:20px;
 font-size:10px;
 font-weight:bold
}

.paid{
 background:#dff4e5;
 color:#17652d
}

.pending{
 background:#fde3e3;
 color:#a21d1d
}

/* PAYMENT HISTORY */

.txn{
 display:flex;
 align-items:center;
 gap:9px;
 padding:10px 0;
 border-bottom:1px solid #eee
}

.txn-icon{
 width:32px;
 height:32px;
 border-radius:50%;
 background:#e7f5ea;
 color:#287a3e;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:14px;
 flex:none
}

.txn-main{
 flex:1;
 min-width:0
}

.txn-title{
 font-weight:bold;
 font-size:12px
}

.txn-date{
 font-size:10px;
 color:#777;
 margin-top:2px
}

.txn-amount{
 font-weight:bold;
 color:#287a3e;
 font-size:12px
}

.txn-note{
 font-size:10px;
 color:#667;
 margin-top:3px
}

.screenshot-btn{
 background:#eef2f8;
 color:#173b72;
 padding:5px 7px;
 font-size:10px
}

/* DAY CALENDAR */

.day-grid{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:6px;
 margin-top:10px
}

.day-box{
 border-radius:8px;
 padding:7px 3px;
 min-height:68px;
 border:1px solid #b9dfc2;
 background:#dff4e5;
 text-align:center;
 cursor:pointer
}

.day-box.pending{
 background:#fde3e3;
 border-color:#efb3b3
}

.day-box.future{
 background:#f1f3f6;
 border-color:#ddd;
 color:#777
}

.day-no{
 font-size:9px;
 font-weight:bold
}

.day-date{
 font-size:9px;
 margin-top:3px
}

.day-status{
 font-size:10px;
 font-weight:bold;
 margin-top:4px
}

.day-amount{
 font-size:11px;
 font-weight:bold;
 margin-top:3px
}

.empty{
 text-align:center;
 padding:18px;
 color:#667
}

.actions{
 display:flex;
 gap:5px;
 flex-wrap:wrap
}

.proof{
 max-width:100%;
 max-height:220px;
 border-radius:8px;
 display:block;
 margin-top:7px
}

.detail-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px
}

.detail-item{
 background:#f7f8fa;
 padding:9px;
 border-radius:7px
}

.doc-row{
 border-top:1px solid #eee;
 padding:9px 0
}

@media(max-width:520px){

 .day-grid{
  grid-template-columns:repeat(4,1fr)
 }

 .day-box{
  min-height:64px
 }

}
</style>
</head>

<body>

<header>
<b style="font-size:20px">🏦 Prince Finance</b>
<div style="font-size:11px">Offline Collection Manager</div>
</header>

<main>

<!-- HOME -->

<section id="home" class="page active">

<h2>Dashboard</h2>

<div class="grid">

<div class="card">
<div class="small">Total Customers</div>
<div id="nc" class="stat">0</div>
</div>

<div class="card">
<div class="small">Amount Given</div>
<div id="tg" class="stat">₹0</div>
</div>

<div class="card">
<div class="small">Amount Collected</div>
<div id="tc" class="stat">₹0</div>
</div>

<div class="card">
<div class="small">Remaining</div>
<div id="tr" class="stat">₹0</div>
</div>

</div>

<div class="card">
<div class="small">Today's Collection</div>
<div id="tt" class="stat">₹0</div>
</div>

<div class="card">
<div id="storageStatus" class="muted">
Starting...
</div>
</div>

</section>


<!-- CUSTOMERS -->

<section id="customers" class="page">

<h2>Customers</h2>

<div class="card">

<input
 id="customerSearch"
 placeholder="🔎 Search customer">

<div style="overflow:auto">

<table class="table">

<thead>
<tr>
<th>No.</th>
<th>Name</th>
<th>Mobile</th>
</tr>
</thead>

<tbody id="customerTable"></tbody>

</table>

</div>

</div>


<div class="card">

<h3>➕ Add Customer</h3>

<label>Name *</label>
<input id="name">

<label>Mobile Number</label>
<input id="mobile" type="tel">

<div class="grid">

<div>
<label>Amount Given *</label>
<input id="given" type="number">
</div>

<div>
<label>Total Amount to Collect *</label>
<input id="target" type="number">
</div>

</div>

<div class="grid">

<div>
<label>Start Date *</label>
<input id="start" type="date">
</div>

<div>
<label>Duration (Days)</label>
<input id="duration" type="number">
</div>

</div>

<label>Expected Daily Payment</label>
<input id="daily" type="number">

<label>Notes</label>
<textarea id="notes"></textarea>

<button id="addBtn" class="full">
Add Customer
</button>

</div>

</section>


<!-- CUSTOMER DETAIL -->

<section id="detail" class="page">

<div id="detailContent"></div>

</section>


<!-- COLLECTION -->

<section id="collect" class="page">

<h2>Today's Collection</h2>

<div class="card">

<label>Date</label>
<input id="date" type="date">

<div class="muted">
Green = Paid &nbsp; | &nbsp; Red = Pending
</div>

</div>

<div id="clist"></div>

</section>


<!-- HISTORY -->

<section id="history" class="page">

<h2>Payment History</h2>

<div id="historyList"></div>

</section>


<!-- BACKUP -->

<section id="reports" class="page">

<h2>Backup & Restore</h2>

<div class="card">

<button id="backupBtn" class="full">
💾 Export Backup
</button>

<button id="restoreBtn" class="full secondary">
♻️ Restore Backup
</button>

<input
 id="restore"
 type="file"
 accept=".json"
 style="display:none">

</div>

</section>

</main>


<nav>

<button data-page="home">
🏠<br>Home
</button>

<button data-page="customers">
👥<br>Customers
</button>

<button data-page="collect">
💰<br>Collection
</button>

<button data-page="history">
📋<br>History
</button>

<button data-page="reports">
💾<br>Backup
</button>

</nav>


<script>

'use strict';


/* DATABASE */

const DB_NAME='PrinceFinanceDB';
const DB_VERSION=2;

const CSTORE='customers';
const PSTORE='payments';
const DSTORE='documents';

let db=null;
let currentCustomerId=null;

const $=id=>document.getElementById(id);

const els={
 nc:$('nc'),
 tg:$('tg'),
 tc:$('tc'),
 tr:$('tr'),
 tt:$('tt'),
 storage:$('storageStatus'),

 name:$('name'),
 mobile:$('mobile'),
 given:$('given'),
 target:$('target'),
 start:$('start'),
 duration:$('duration'),
 daily:$('daily'),
 notes:$('notes'),
 addBtn:$('addBtn'),

 table:$('customerTable'),
 search:$('customerSearch'),

 detail:$('detailContent'),

 date:$('date'),
 clist:$('clist'),

 history:$('historyList'),

 backup:$('backupBtn'),
 restoreBtn:$('restoreBtn'),
 restore:$('restore')
};


function localDate(d=new Date()){

 return d.getFullYear()+'-'+
 String(d.getMonth()+1).padStart(2,'0')+'-'+
 String(d.getDate()).padStart(2,'0');

}


const today=localDate();


function money(x){

 return '₹'+
 (Number(x)||0).toLocaleString(
  'en-IN',
  {maximumFractionDigits:2}
 );

}


function prettyDate(s){

 if(!s)return '-';

 const d=
  new Date(s+'T00:00:00');

 return d.toLocaleDateString(
  'en-IN',
  {
   day:'2-digit',
   month:'short',
   year:'numeric'
  }
 );

}


function esc(x){

 return String(x??'')
 .replace(
  /[&<>"']/g,
  s=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#39;'
  }[s])
 );

}


function uid(){

 if(
  window.crypto &&
  typeof window.crypto.randomUUID==='function'
 ){

  return window.crypto.randomUUID();

 }

 return Date.now()+'-'+
 Math.random().toString(16).slice(2);

}


/* DATABASE */

function openDB(){

 return new Promise(
  (resolve,reject)=>{

   const r=
    indexedDB.open(
     DB_NAME,
     DB_VERSION
    );


   r.onupgradeneeded=e=>{

    const d=e.target.result;


    if(
     !d.objectStoreNames.contains(CSTORE)
    ){

     d.createObjectStore(
      CSTORE,
      {keyPath:'id'}
     );

    }


    if(
     !d.objectStoreNames.contains(PSTORE)
    ){

     const s=
      d.createObjectStore(
       PSTORE,
       {keyPath:'id'}
      );

     s.createIndex(
      'cid',
      'cid',
      {unique:false}
     );

     s.createIndex(
      'date',
      'date',
      {unique:false}
     );

    }


    if(
     !d.objectStoreNames.contains(DSTORE)
    ){

     const s=
      d.createObjectStore(
       DSTORE,
       {keyPath:'id'}
      );

     s.createIndex(
      'cid',
      'cid',
      {unique:false}
     );

    }

   };


   r.onsuccess=()=>{

    db=r.result;
    resolve(db);

   };


   r.onerror=()=>reject(r.error);

  }
 );

}


function request(r){

 return new Promise(
  (resolve,reject)=>{

   r.onsuccess=
    ()=>resolve(r.result);

   r.onerror=
    ()=>reject(r.error);

  }
 );

}


function all(store){

 return request(
  db
  .transaction(store,'readonly')
  .objectStore(store)
  .getAll()
 );

}


function get(store,id){

 return request(
  db
  .transaction(store,'readonly')
  .objectStore(store)
  .get(id)
 );

}


function put(store,obj){

 return request(
  db
  .transaction(store,'readwrite')
  .objectStore(store)
  .put(obj)
 );

}


function del(store,id){

 return request(
  db
  .transaction(store,'readwrite')
  .objectStore(store)
  .delete(id)
 );

}


async function paymentsFor(cid){

 const p=await all(PSTORE);

 return p.filter(
  x=>x.cid===cid
 );

}


async function documentsFor(cid){

 const d=await all(DSTORE);

 return d.filter(
  x=>x.cid===cid
 );

}


/* DASHBOARD */

async function dashboard(){

 const cs=await all(CSTORE);
 const ps=await all(PSTORE);

 const given=
  cs.reduce(
   (s,c)=>s+Number(c.given||0),
   0
  );

 const collected=
  ps.reduce(
   (s,p)=>s+Number(p.amount||0),
   0
  );

 const target=
  cs.reduce(
   (s,c)=>s+Number(c.target||0),
   0
  );

 const tc=
  ps
  .filter(p=>p.date===today)
  .reduce(
   (s,p)=>s+Number(p.amount||0),
   0
  );

 els.nc.textContent=cs.length;
 els.tg.textContent=money(given);
 els.tc.textContent=money(collected);

 els.tr.textContent=
  money(
   Math.max(0,target-collected)
  );

 els.tt.textContent=money(tc);

 els.storage.textContent=
  'Offline database active • '+
  cs.length+
  ' customers';

}


/* PAGE */

function show(page){

 document
 .querySelectorAll('.page')
 .forEach(
  x=>x.classList.remove('active')
 );

 $(page).classList.add('active');

 if(page==='home')
  dashboard();

 if(page==='customers')
  renderCustomers();

 if(page==='collect')
  renderCollect();

 if(page==='history')
  renderHistory();

}


/* CUSTOMER LIST */

async function renderCustomers(){

 const cs=await all(CSTORE);

 const q=
  els.search.value
  .trim()
  .toLowerCase();

 const list=
  cs.filter(
   c=>
    (
     c.name+' '+
     (c.mobile||'')
    )
    .toLowerCase()
    .includes(q)
  );

 list.sort(
  (a,b)=>
   String(a.name)
   .localeCompare(String(b.name))
 );

 els.table.innerHTML='';

 if(!list.length){

  els.table.innerHTML=
   '<tr>'+
   '<td colspan="3" class="empty">'+
   'No customers found.'+
   '</td></tr>';

  return;

 }

 list.forEach(
  (c,i)=>{

   const row=
    document.createElement('tr');

   row.className='customer-row';

   row.dataset.id=c.id;

   row.innerHTML=
    '<td>'+String(i+1).padStart(2,'0')+'</td>'+
    '<td><b>'+esc(c.name)+'</b></td>'+
    '<td>'+esc(c.mobile||'-')+'</td>';

   els.table.appendChild(row);

  }
 );

}


/* ADD CUSTOMER */

async function addCustomer(){

 try{

  const n=
   els.name.value.trim();

  const g=
   Number(els.given.value);

  const t=
   Number(els.target.value);

  const s=
   els.start.value;


  if(
   !n ||
   !Number.isFinite(g) ||
   !Number.isFinite(t) ||
   !s
  ){

   alert(
    'Name, Amount Given, Total Amount aur Start Date bharna zaroori hai.'
   );

   return;

  }


  const c={

   id:uid(),

   name:n,

   mobile:
    els.mobile.value.trim(),

   given:g,

   target:t,

   start:s,

   duration:
    Number(els.duration.value)||0,

   daily:
    Number(els.daily.value)||0,

   notes:
    els.notes.value.trim(),

   createdAt:
    new Date().toISOString()

  };


  await put(
   CSTORE,
   c
  );


  els.name.value='';
  els.mobile.value='';
  els.given.value='';
  els.target.value='';
  els.duration.value='';
  els.daily.value='';
  els.notes.value='';

  els.start.value=today;


  await dashboard();
  await renderCustomers();


  alert(
   'Customer added successfully.'
  );


 }catch(e){

  console.error(e);

  alert(
   'Customer save nahi hua: '+
   e.message
  );

 }

}


/* CUSTOMER DETAIL */

async function openCustomer(id){

 currentCustomerId=id;

 const c=
  await get(CSTORE,id);

 if(!c){

  alert('Customer not found.');
  return;

 }

 const ps=
  await paymentsFor(id);

 const docs=
  await documentsFor(id);

 const collected=
  ps.reduce(
   (s,p)=>s+Number(p.amount||0),
   0
  );

 const remaining=
  Math.max(
   0,
   Number(c.target||0)-collected
  );


 ps.sort(
  (a,b)=>
   b.date.localeCompare(a.date)
 );


 let h='';


 h+=
 '<button class="secondary" onclick="show(\'customers\')">'+
 '← Customers'+
 '</button>';


 h+=
 '<h2>'+esc(c.name)+'</h2>';


 /* DETAILS */

 h+=
 '<div class="card">'+

 '<div class="detail-grid">'+

 '<div class="detail-item">'+
 '<div class="small">Mobile</div>'+
 '<b>'+esc(c.mobile||'-')+'</b>'+
 '</div>'+

 '<div class="detail-item">'+
 '<div class="small">Start Date</div>'+
 '<b>'+prettyDate(c.start)+'</b>'+
 '</div>'+

 '<div class="detail-item">'+
 '<div class="small">Amount Given</div>'+
 '<b>'+money(c.given)+'</b>'+
 '</div>'+

 '<div class="detail-item">'+
 '<div class="small">Total Collect</div>'+
 '<b>'+money(c.target)+'</b>'+
 '</div>'+

 '<div class="detail-item">'+
 '<div class="small">Collected</div>'+
 '<b>'+money(collected)+'</b>'+
 '</div>'+

 '<div class="detail-item">'+
 '<div class="small">Remaining</div>'+
 '<b>'+money(remaining)+'</b>'+
 '</div>'+

 '</div>';


 if(c.notes){

  h+=
   '<p class="small">'+
   '<b>Notes:</b> '+
   esc(c.notes)+
   '</p>';

 }

 h+='</div>';


 /* CALENDAR */

 h+=
 '<div class="card">'+

 '<h3>📅 Payment Calendar</h3>'+

 '<div class="small">'+
 '🟢 Paid &nbsp;&nbsp; 🔴 Pending &nbsp;&nbsp; ⚪ Upcoming'+
 '</div>'+

 '<div class="day-grid">';


 const start=
  new Date(c.start+'T00:00:00');

 const duration=
  Math.max(
   0,
   Number(c.duration||0)
  );

 const td=
  new Date(today+'T00:00:00');


 for(
  let i=0;
  i<duration;
  i++
 ){

  const d=
   new Date(start);

  d.setDate(
   start.getDate()+i
  );

  const ds=
   localDate(d);

  const p=
   ps.find(
    x=>x.date===ds
   );

  const future=
   d>td;

  let cls='';

  let status='';

  if(future){

   cls='future';
   status='UPCOMING';

  }else if(p){

   cls='';
   status='PAID';

  }else{

   cls='pending';
   status='PENDING';

  }


  h+=
   '<div class="day-box '+cls+
   '" onclick="openCollectionDay(\''+
   c.id+
   '\',\''+
   ds+
   '\')">'+

   '<div class="day-no">DAY '+
   (i+1)+
   '</div>'+

   '<div class="day-date">'+
   prettyDate(ds)+
   '</div>'+

   '<div class="day-status">'+
   status+
   '</div>';


  if(p){

   h+=
    '<div class="day-amount">'+
    money(p.amount)+
    '</div>';

  }


  h+=
   '</div>';

 }


 if(duration===0){

  h+=
   '<div class="empty" style="grid-column:1/-1">'+
   'Duration enter nahi hai.'+
   '</div>';

 }


 h+=
 '</div></div>';


 /* DOCUMENTS */

 h+=
 '<div class="card">'+

 '<h3>📄 Documents</h3>'+

 '<label>Document</label>'+

 '<input id="docFile" type="file" accept="image/*,.pdf,.doc,.docx,.txt">'+

 '<label>Document Name</label>'+

 '<input id="docName" placeholder="Aadhaar / Agreement / PAN">'+

 '<button class="full" onclick="uploadDocument()">'+
 '📤 Upload Document'+
 '</button>';


 if(!docs.length){

  h+=
   '<div class="empty">'+
   'No documents uploaded.'+
   '</div>';

 }else{

  docs.forEach(
   d=>{

    h+=
     '<div class="doc-row">'+

     '<b>'+
     esc(d.name)+
     '</b>'+

     '<div class="small">'+
     esc(d.fileName||'')+
     '</div>';


    if(
     d.type &&
     d.type.startsWith('image/')
    ){

     h+=
      '<img class="proof" src="'+
      d.data+
      '">';

    }


    h+=
     '<div class="actions">'+

     '<button onclick="viewDocument(\''+
     d.id+
     '\')">'+
     'Open'+
     '</button>'+

     '<button class="danger" onclick="deleteDocument(\''+
     d.id+
     '\')">'+
     'Delete'+
     '</button>'+

     '</div>'+

     '</div>';

   }
  );

 }

 h+='</div>';


 /* PAYMENT HISTORY */

 h+=
 '<div class="card">'+

 '<h3>💰 Payment History</h3>';


 if(!ps.length){

  h+=
   '<div class="empty">'+
   'No payment yet.'+
   '</div>';

 }else{

  ps.forEach(
   p=>{

    h+=
     '<div class="txn">'+

     '<div class="txn-icon">✓</div>'+

     '<div class="txn-main">'+

     '<div class="txn-title">'+
     'Payment received'+
     '</div>'+

     '<div class="txn-date">'+
     prettyDate(p.date)+
     '</div>';


    if(p.note){

     h+=
      '<div class="txn-note">'+
      esc(p.note)+
      '</div>';

    }


    h+=
     '</div>'+

     '<div style="text-align:right">'+

     '<div class="txn-amount">+'+
     money(p.amount)+
     '</div>';


    if(p.image){

     h+=
      '<button class="screenshot-btn" onclick="viewPaymentImage(\''+
      p.id+
      '\')">'+
      '📷 View'+
      '</button>';

    }


    h+=
     '<br>'+

     '<button class="danger" onclick="removePayment(\''+
     p.id+
     '\')">'+
     'Delete'+
     '</button>'+

     '</div>'+

     '</div>';

   }
  );

 }


 h+='</div>';


 /* DELETE CUSTOMER */

 h+=
 '<div class="card">'+

 '<button class="danger full" onclick="deleteCustomer(\''+
 c.id+
 '\')">'+
 '🗑️ Delete Customer'+
 '</button>'+

 '</div>';

/* COLLECTION */

async function renderCollect(){

 const selected=
  els.date.value||today;

 const cs=
  await all(CSTORE);

 els.clist.innerHTML='';


 if(!cs.length){

  els.clist.innerHTML=
   '<div class="card empty">'+
   'No customers.'+
   '</div>';

  return;

 }


 cs.sort(
  (a,b)=>
   String(a.name)
   .localeCompare(String(b.name))
 );


 for(const c of cs){

  const ps=
   await paymentsFor(c.id);

  const old=
   ps.find(
    p=>p.date===selected
   );


  const box=
   document.createElement('div');

  box.className='card';

  box.id=
   'collect-'+c.id;


  box.innerHTML=

   '<div style="display:flex;justify-content:space-between;align-items:center;gap:5px">'+

   '<div>'+

   '<b>'+esc(c.name)+'</b>'+

   '<div class="small">'+
   esc(c.mobile||'')+
   '</div>'+

   '</div>'+

   '<span class="badge '+
   (old?'paid':'pending')+
   '">'+
   (old?'✅ PAID':'❌ PENDING')+
   '</span>'+

   '</div>'+

   '<div class="small" style="margin-top:6px">'+
   'Expected: '+money(c.daily||0)+
   (old?' • Received: '+money(old.amount):'')+
   '</div>'+

   '<label>Actual Amount Received</label>'+

   '<input class="amount" type="number" value="'+
   (old?esc(old.amount):'')+
   '">'+

   '<label>Payment Screenshot</label>'+

   '<input class="image" type="file" accept="image/*">'+

   '<label>Note</label>'+

   '<input class="note" value="'+
   (old?esc(old.note||''):'')+
   '">' +

   '<div class="actions">'+

   '<button onclick="savePayment(\''+
   c.id+
   '\')">'+
   (old?'Update Payment':'Save Payment')+
   '</button>'+

   (
    old
    ?
    '<button class="danger" onclick="removePayment(\''+
    old.id+
    '\')">Delete</button>'
    :
    ''
   )+

   '</div>';


  if(old && old.image){

   box.innerHTML+=
    '<button class="screenshot-btn" onclick="viewPaymentImage(\''+
    old.id+
    '\')">📷 View Screenshot</button>';

  }


  els.clist.appendChild(box);

 }

}


/* SAVE PAYMENT */

async function savePayment(cid){

 try{

  const box=
   document.getElementById(
    'collect-'+cid
   );

  const amount=
   Number(
    box.querySelector('.amount').value
   )||0;


  if(amount<=0){

   alert(
    'Amount enter karo.'
   );

   return;

  }


  const date=
   els.date.value||today;


  const ps=
   await paymentsFor(cid);


  const old=
   ps.find(
    p=>p.date===date
   );


  const file=
   box.querySelector('.image')
   .files[0];


  let image=
   old?.image||'';


  if(file){

   image=
    await fileDataURL(file);

  }


  await put(
   PSTORE,
   {
    id:old?old.id:uid(),
    cid:cid,
    date:date,
    amount:amount,
    note:
     box.querySelector('.note').value.trim(),
    image:image,
    updatedAt:
     new Date().toISOString()
   }
  );


  await dashboard();

  await renderCollect();


 }catch(e){

  alert(
   'Payment save nahi hua: '+
   e.message
  );

 }

}

/* DELETE PAYMENT */

async function removePayment(id){

 if(
  !confirm(
   'Payment delete karna hai?'
  )
 )return;


 await del(
  PSTORE,
  id
 );


 await dashboard();


 if(currentCustomerId){

  await openCustomer(
   currentCustomerId
  );

 }else{

  await renderCollect();
  await renderHistory();

 }

}


/* DELETE CUSTOMER */

async function deleteCustomer(id){

 const c=
  await get(CSTORE,id);

 if(!c)return;


 if(
  !confirm(
   'Customer '+c.name+
   ' aur uske ALL payments/documents delete karne hain?'
  )
 )return;


 const ps=
  await paymentsFor(id);

 for(const p of ps){

  await del(
   PSTORE,
   p.id
  );

 }


 const docs=
  await documentsFor(id);

 for(const d of docs){

  await del(
   DSTORE,
   d.id
  );

 }


 await del(
  CSTORE,
  id
 );


 currentCustomerId=null;


 await dashboard();
 await renderCustomers();

 show('customers');

}


/* FILE DATA */

function fileDataURL(file){

 return new Promise(
  (resolve,reject)=>{

   const r=
    new FileReader();

   r.onload=
    ()=>resolve(r.result);

   r.onerror=
    ()=>reject(r.error);

   r.readAsDataURL(file);

  }
 );

}


/* DOCUMENT UPLOAD */

async function uploadDocument(){

 try{

  const file=
   document.getElementById(
    'docFile'

/* BACKUP */

async function backup(){

 try{

  const data={

   format:'Prince Finance Backup',

   version:2,

   exportedAt:
    new Date().toISOString(),

   customers:
    await all(CSTORE),

   payments:
    await all(PSTORE),

   documents:
    await all(DSTORE)

  };


  const blob=
   new Blob(
    [JSON.stringify(data)],
    {type:'application/json'}
   );


  const url=
   URL.createObjectURL(blob);


  const a=
   document.createElement('a');

  a.href=url;

  a.download=
   'Prince-Finance-Backup-'+
   today+
   '.json';


  document.body.appendChild(a);

  a.click();

  a.remove();


  URL.revokeObjectURL(url);


 }catch(e){

  alert(
   'Backup failed: '+
   e.message
  );

 }

}


/* RESTORE */

async function restoreBackup(file){

 try{

  const data=
   JSON.parse(
    await file.text()
   );


  if(
   !data ||
   !Array.isArray(data.customers) ||
   !Array.isArray(data.payments)
  ){

   throw new Error(
    'Invalid backup'
   );

  }


  if(
   !confirm(
    'Existing data replace karke backup restore karein?'
   )
  )return;


  const tx=
   db.transaction(
    [CSTORE,PSTORE,DSTORE],
    'readwrite'
   );


  const cs=
   tx.objectStore(CSTORE);

  const ps=
   tx.objectStore(PSTORE);

  const ds=
   tx.objectStore(DSTORE);


  cs.clear();
  ps.clear();
  ds.clear();


  data.customers.forEach(
   x=>cs.put(x)
  );


  data.payments.forEach(
   x=>ps.put(x)
  );


  (
   data.documents||[]
  ).forEach(
   x=>ds.put(x)
  );


  await new Promise(
   (resolve,reject)=>{

    tx.oncomplete=resolve;

    tx.onerror=
     ()=>reject(tx.error);

   }
  );


  await dashboard();
  await renderCustomers();
  await renderCollect();
  await renderHistory();


  alert(
   'Backup restored successfully.'
  );


 }catch(e){

  alert(
   'Restore failed: '+
   e.message
  );

 }

}
